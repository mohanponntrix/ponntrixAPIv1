server:
  port: 8093

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://eureka-admin:eureka-admin123@localhost:8100/eureka/

spring:
  application:
    name: hospital-service

  datasource:
    url: jdbc:postgresql://187.127.156.147:5438/hospital_db
    username: hospital_user
    password: hospital_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
